<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Florevah — Costeo e inventario</title>

<!-- PWA: esto es lo que le dice al celular "esto se puede instalar como app" -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A57BC4">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="florevah">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- SDK de Firebase (versión "compat", pensada para <script> normales sin necesitar un
     empaquetador — encaja con cómo está armado el resto de esta app). Siempre antes de
     01-estado.js, que es quien lo usa. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<!-- El orden importa: cada archivo puede usar funciones/variables de los anteriores.
     13-app.js SIEMPRE va de último porque arranca la app (loadState -> render). -->
<script src="js/01-estado.js"></script>
<script src="js/02-ui.js"></script>
<script src="js/03-helpers.js"></script>
<script src="js/04-insumos.js"></script>
<script src="js/05-productos.js"></script>
<script src="js/06-pedidos.js"></script>
<script src="js/07-balance.js"></script>
<script src="js/08-analisis.js"></script>
<script src="js/09-historial.js"></script>
<script src="js/10-actividad.js"></script>
<script src="js/11-resumen.js"></script>
<script src="js/12-inicio.js"></script>
<script src="js/13-app.js"></script>

<!-- Registro del service worker (le da a la app soporte offline básico y hace que el
     celular la reconozca como "instalable"). Si falla (ej. abriéndola en localhost sin
     https), no rompe nada — la app sigue funcionando normal, solo sin esto. -->
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('Service worker no se pudo registrar:', err));
    });
  }
</script>
</body>
</html>
